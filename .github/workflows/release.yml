name: Release
# 對齊 hit/erp 的 changeset 驅動流程（單一靜態站版本）：
#   - 只有 main 且有 pending changeset（.changeset/*-*.md）才發版
#   - 本地只跑 `pnpm changeset`；版本 bump 由 CI 負責
#   - 發版 = verify → changeset version → build → 部署 Pages（= erp 的 rtw）
#     → commit「# Version」推回 main（[skip ci]）→ changeset tag（tag 指向新版 commit）
# 手動觸發（workflow_dispatch）：push changeset 到 main 後不會自動上 Pages，
# 由維護者到 Actions 手動 Run workflow，作為「反悔」關卡。
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 對應 erp workflow.rules：偵測是否有 pending changeset。
  # changesets CLI 檔名固定 <adj>-<noun>-<verb>.md，用 *-*.md 排除 README.md / config.json。
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_changeset: ${{ steps.check.outputs.has_changeset }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if ls .changeset/*-*.md >/dev/null 2>&1; then
            echo "has_changeset=true" >> "$GITHUB_OUTPUT"
          else
            echo "偵測不到 pending changeset，略過發版"
            echo "has_changeset=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.has_changeset == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- verify ---
      - run: pnpm typecheck
      - run: pnpm test

      # --- 版本 bump（CI 負責，對齊 erp）---
      - run: pnpm changeset version

      # --- build（使用 bump 後版本）---
      - run: pnpm build

      # --- 部署 GitHub Pages（= erp 的 rtw 發佈目標）---
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # --- 打 tag + 推「# Version」commit 回 main ---
      - name: Tag & push version
        run: |
          git config user.email "ci-release-bot@users.noreply.github.com"
          git config user.name "CI Release Bot"
          git add -A
          {
            echo "# Version"
            for PKG in $(git diff --cached --name-only | grep 'package\.json$'); do
              NAME=$(node -p "require('./$PKG').name")
              VERSION=$(node -p "require('./$PKG').version")
              echo "- ${NAME}@${VERSION}"
            done
            echo ""
            echo "[skip ci]"
          } > /tmp/version-msg.txt
          git commit -F /tmp/version-msg.txt
          # rebase 到最新 main（處理等待期間的並行推送）
          git fetch origin main
          git rebase origin/main
          # 在 # Version commit（package.json 已是新版）上打 tag
          pnpm changeset tag
          git push origin HEAD:main
          git push origin --tags

      # --- 快捷鍵擴充套件：壓縮檔掛在這一版的 GitHub Release ---
      # 使用者手動安裝（載入未封裝項目）。Release 的 latest/download 連結永遠指向
      # 最新版，網站與 README 的下載連結都固定寫那一條，不必每版改。
      # 放在 tag 推完之後：gh release create 要那個 tag 已經存在。
      - name: Release extension zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          rm -rf maplestory-toolkit-hotkeys
          cp -r extension maplestory-toolkit-hotkeys
          zip -r maplestory-toolkit-hotkeys.zip maplestory-toolkit-hotkeys
          # 這一版的 CHANGELOG 段落當 Release 說明（跟 Discord 通知用同一個切法）
          node -e "const fs=require('fs');const c=fs.readFileSync('CHANGELOG.md','utf8');const m=c.match(/##\\s+[^\\n]*\\n([\\s\\S]*?)(?:\\n##\\s|$)/);fs.writeFileSync('/tmp/notes.md',m?m[1].trim():'')"
          gh release create "$TAG" maplestory-toolkit-hotkeys.zip --title "$TAG" --notes-file /tmp/notes.md

      # --- Discord 發版通知（未設 DISCORD_WEBHOOK secret 時自動略過）---
      - name: Discord notify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/notify-discord.mjs
